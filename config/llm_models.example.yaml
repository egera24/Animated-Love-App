# LLM model catalog — provider order = fallback order.
# Copy to llm_models.yaml to customize (optional; example file is used if missing).
# Providers without an API key in .env are skipped automatically.

providers:
  groq:
    models:
      - llama-3.3-70b-versatile      # best quality
      - llama-3.1-8b-instant         # faster / lighter quota
      - gemma2-9b-it
  gemini:
    models:
      - gemini-2.0-flash
      - gemini-2.0-flash-lite
      - gemini-1.5-flash
  openrouter:
    models:
      - google/gemma-2-9b-it:free
      - meta-llama/llama-3.2-3b-instruct:free
      - qwen/qwen-2-7b-instruct:free
